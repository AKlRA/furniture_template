<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Santalum Maison Templates</title>
  <style>
    :root { --paper: #f4f4f1; --ink: #171615; --ink-2: #5b5956; --line: rgba(23, 22, 21, 0.12); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--paper); color: var(--ink); font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; }
    main { width: min(560px, 100%); }
    h1 { margin: 0 0 1.5rem; font: 500 2rem/1.1 Georgia, serif; letter-spacing: -0.02em; }
    a { display: flex; justify-content: space-between; align-items: center; padding: 1.1rem 0; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
    a:last-child { border-bottom: 1px solid var(--line); }
    a span { color: var(--ink-2); font-size: 0.9rem; }
    a:hover strong { text-decoration: underline; text-underline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Santalum Maison templates</h1>
    <a href="template/"><strong>Template 1</strong><span>Grey canvas, dark cinematic panels</span></a>
    <a href="template%202/"><strong>Template 2</strong><span>Light editorial, serif display</span></a>
    <a href="template%203/"><strong>Template 3</strong><span>Cream and red sandalwood, storefront</span></a>
    <a href="template%204/"><strong>Template 4</strong><span>Editorial stories, wood palette, card deck</span></a>
    <a href="template%205/"><strong>Template 5</strong><span>Stacked cards, light and dark themes</span></a>
  </main>
</body>
</html>
